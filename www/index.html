<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2E9E6B">
<title>蕊之管家</title>
<style>
  html,body{margin:0;height:100%;background:#F2F4F7;overflow:hidden;
    font-family:-apple-system,"HarmonyOS Sans SC","PingFang SC",system-ui,sans-serif}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(165deg,#2E9E6B,#9BE3B9)}
  #boot .t{color:#fff;font-size:22px;font-weight:600;letter-spacing:2px}
  #boot .s{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:1px}
  #boot .dot{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="dot"></div><div class="t">蕊之管家</div><div class="s">正在启动</div></div>
<script>
(function () {
  var APP_URL   = "https://raw.githubusercontent.com/tgg-11/travel-assistant/main/www/app.html";
  var CACHE_KEY = "rzgj_cache_v1";
  var CHECK_KEY = "rzgj_last_check";
  var CHECK_GAP = 6 * 3600 * 1000;

  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) { return null; }
  }
  function writeCache(h, html) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ h: h, html: html })); } catch (e) {}
  }
  function render(html) {
    document.open(); document.write(html); document.close();
  }
  function timeoutFetch(url, ms) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; reject(new Error("timeout")); } }, ms);
      fetch(url, { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (txt) {
        if (!done) { done = true; clearTimeout(t); resolve(txt); }
      }).catch(function (e) { if (!done) { done = true; clearTimeout(t); reject(e); } });
    });
  }

  // 背景检查：取到新版本就存下来并重载一次
  function backgroundCheck(currentHash) {
    timeoutFetch(APP_URL + "?t=" + Date.now(), 6000).then(function (txt) {
      if (!txt || txt.length < 500) return;
      var h = hash(txt);
      if (h === currentHash) return;
      writeCache(h, txt);
      try { localStorage.setItem(CHECK_KEY, String(Date.now())); } catch (e) {}
      var guard = sessionStorage.getItem("rzgj_reloaded");
      if (guard !== h) {
        sessionStorage.setItem("rzgj_reloaded", h);
        setTimeout(function () { location.reload(); }, 600);
      }
    }).catch(function () {});
  }

  var cache = readCache();
  var lastCheck = 0;
  try { lastCheck = parseInt(localStorage.getItem(CHECK_KEY) || "0", 10) || 0; } catch (e) {}
  var fresh = (Date.now() - lastCheck) < CHECK_GAP;

  if (cache && cache.html && fresh) {
    render(cache.html);
    backgroundCheck(cache.h);
    return;
  }

  var source = APP_URL + "?t=" + Date.now();
  if (!cache || !cache.html) source = "app.html";

  timeoutFetch(source, 2500).then(function (txt) {
    if (txt && txt.length > 500 && txt.indexOf("<html") >= 0) {
      var h = hash(txt);
      writeCache(h, txt);
      try { localStorage.setItem(CHECK_KEY, String(Date.now())); } catch (e) {}
      render(txt);
    } else if (cache && cache.html) {
      render(cache.html);
    } else {
      throw new Error("empty");
    }
  }).catch(function () {
    if (cache && cache.html) { render(cache.html); return; }
    fetch("app.html").then(function (r) { return r.text(); }).then(function (t) {
      var h = hash(t);
      writeCache(h, t);
      render(t);
    }).catch(function () {
      document.getElementById("boot").innerHTML =
        '<div class="t">加载失败</div><div class="s">请检查网络后重新打开</div>';
    });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2E9E6B">
<title>蕊之管家</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2E9E6B}
  #boot{position:fixed;inset:0;background:#2E9E6B}
  /* 方框：和系统启动图完全同位置（屏幕正中）、同比例（约占屏宽 33.6%） */
  #logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:33.6vw;height:33.6vw;border-radius:7.5vw;background:rgba(255,255,255,.17);
    display:flex;align-items:center;justify-content:center;line-height:1;
    font-size:16.5vw;color:#fff;font-weight:500}
  #txt{position:absolute;left:0;right:0;top:calc(50% + 20.5vw);text-align:center;
    color:#fff;opacity:0;transition:opacity .3s ease}
  #txt.on{opacity:1}
  #name{font-size:23px;font-weight:600;letter-spacing:7px;text-indent:7px}
  #sub{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:2px;margin-top:8px}
  #spin{width:24px;height:24px;margin:26px auto 0;border:2.5px solid rgba(255,255,255,.28);
    border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot">
  <div id="logo">蕊</div>
  <div id="txt"><div id="name">蕊之管家</div><div id="sub">正在加载</div><div id="spin"></div></div>
</div>
<script>
(function () {
  var REPO = "tgg-11/travel-assistant";
  var PATH = "www/app.html";
  var SOURCES = [
    "https://raw.githubusercontent.com/" + REPO + "/main/" + PATH,
    "https://cdn.jsdelivr.net/gh/" + REPO + "@main/" + PATH,
    "https://gcore.jsdelivr.net/gh/" + REPO + "@main/" + PATH,
    "https://ghproxy.net/https://raw.githubusercontent.com/" + REPO + "/main/" + PATH
  ];
  var CACHE = "rzgj_app_v1";
  var T0 = Date.now();
  var MIN_SHOW = 900;

  setTimeout(function(){
    var t = document.getElementById("txt");
    if (t) t.classList.add("on");
  }, 160);

  function hash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
  function valid(t){ return !!t && t.length > 2000 && t.indexOf("<html") >= 0; }
  function readCache(){ try { return JSON.parse(localStorage.getItem(CACHE) || "null"); } catch(e){ return null; } }
  function saveCache(h,t){ try { localStorage.setItem(CACHE, JSON.stringify({h:h,html:t})); } catch(e){} }
  function render(t){ document.open(); document.write(t); document.close(); }

  function tryOne(url, ms){
    return new Promise(function(resolve, reject){
      var done=false;
      var timer=setTimeout(function(){ if(!done){done=true;reject();} }, ms);
      fetch(url + (url.indexOf("?")>-1?"&":"?") + "t=" + Date.now(), {cache:"no-store"})
        .then(function(r){ return r.text(); })
        .then(function(t){ if(done) return; done=true; clearTimeout(timer); if(valid(t)) resolve(t); else reject(); })
        .catch(function(){ if(!done){done=true;clearTimeout(timer);reject();} });
    });
  }
  function fromNetwork(ms){
    return new Promise(function(resolve){
      var pending=SOURCES.length, finished=false;
      SOURCES.forEach(function(u){
        tryOne(u,ms).then(function(t){ if(!finished){finished=true;resolve(t);} })
                   .catch(function(){ if(--pending===0 && !finished){finished=true;resolve(null);} });
      });
    });
  }
  function bgUpdate(cur){
    fromNetwork(6000).then(function(t){
      if(!t) return;
      var h=hash(t); if(h===cur) return;
      saveCache(h,t);
      try{ if(sessionStorage.getItem("rzgj_reload")===h) return; sessionStorage.setItem("rzgj_reload",h); }catch(e){}
      setTimeout(function(){ location.reload(); }, 400);
    });
  }
  function play(html){
    var wait = Math.max(0, MIN_SHOW - (Date.now() - T0));
    setTimeout(function(){ render(html); }, wait);
  }

  var cache = readCache();
  if (cache && cache.html) { play(cache.html); bgUpdate(cache.h); return; }

  fetch("app.html").then(function(r){ return r.text(); }).then(function(local){
    if(!valid(local)) throw new Error("bad");
    saveCache(hash(local), local);
    play(local);
    bgUpdate(hash(local));
  }).catch(function(){
    fromNetwork(4000).then(function(t){
      if(t){ saveCache(hash(t), t); play(t); bgUpdate(hash(t)); }
      else { document.getElementById("sub").textContent = "加载失败，请检查网络"; }
    });
  });
})();
</script>
</body>
</html>
